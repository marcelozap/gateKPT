<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Mirror</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage" aria-label="Voice Mirror live visualizer">
      <canvas id="visualizer" aria-label="Live audio reactive visuals"></canvas>

      <section class="hud" aria-label="Performance controls">
        <div class="brand">
          <span class="mark"></span>
          <span>Voice Mirror</span>
        </div>

        <div class="controls">
          <button id="startButton" type="button" title="Start live audio analysis">Start</button>
          <button id="fullscreenButton" type="button" title="Project fullscreen">Fullscreen</button>
          <button id="blackoutButton" type="button" title="Blackout projector output">Blackout</button>

          <label>
            Input
            <select id="inputSelect" aria-label="Audio input"></select>
          </label>

          <label>
            Mode
            <select id="modeSelect" aria-label="Visual mode">
              <option value="prism">Prism</option>
              <option value="aurora">Aurora</option>
              <option value="cathedral">Cathedral</option>
              <option value="storm">Storm</option>
              <option value="grid">Grid</option>
            </select>
          </label>

          <label>
            Palette
            <select id="paletteSelect" aria-label="Color palette">
              <option value="auto">Auto</option>
              <option value="neon">Neon</option>
              <option value="ember">Ember</option>
              <option value="ice">Ice</option>
              <option value="royal">Royal</option>
            </select>
          </label>

          <label>
            Quality
            <select id="qualitySelect" aria-label="Render quality">
              <option value="balanced">Balanced</option>
              <option value="eco">Eco</option>
              <option value="ultra">Ultra</option>
            </select>
          </label>

          <label class="slider">
            Sensitivity
            <input id="sensitivity" type="range" min="0.35" max="2.5" value="1.15" step="0.01" />
          </label>

          <label class="slider">
            Bloom
            <input id="bloom" type="range" min="0" max="1" value="0.72" step="0.01" />
          </label>

          <label class="slider">
            Motion
            <input id="motion" type="range" min="0.25" max="1.8" value="1" step="0.01" />
          </label>
        </div>

        <div class="meters" aria-label="Audio meters">
          <span id="noteMeter">--</span>
          <span id="levelMeter">0%</span>
          <span id="beatMeter">BEAT --</span>
          <span id="bridgeMeter">LOCAL</span>
          <span id="midiMeter">MIDI --</span>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
